name: 单元测试

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: test/${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Web 单元测试
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          node-manager: true
          run-install: false
          version-file: package.json

      - name: Install depends
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vp pm config set '//npm.pkg.github.com/:_authToken' "$GITHUB_TOKEN"
          vp i --frozen-lockfile

      - name: Test
        run: |
          vpr @delta-comic/plugin-jmcomic#build
          vp test run