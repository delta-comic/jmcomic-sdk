packages:
  - packages/*

allowBuilds:
  esbuild: true
  msw: true
  sharp: true

catalog:
  '@commitlint/cli': ^21.2.2
  '@commitlint/config-conventional': ^21.2.2
  '@semantic-release/commit-analyzer': ^13.0.1
  '@semantic-release/github': ^12.0.9
  '@semantic-release/release-notes-generator': ^14.1.1
  '@tailwindcss/vite': ^4.3.3
  '@types/node': 25.9.3
  '@vitejs/plugin-vue': ^6.0.8
  '@vicons/material': ^0.13.0
  '@vitest/coverage-v8': 4.1.10
  '@vue/test-utils': ^2.4.11
  browserslist: ^4.28.8
  happy-dom: ^20.11.2
  crypto-es: ^3.1.3
  es-toolkit: 1.50.0
  ky: ^2.0.2
  lightningcss: ^1.33.0
  msw: ^2.15.0
  naive-ui: ^2.45.2
  oxlint-tsgolint: ^7.0.2001
  semantic-release: ^25.0.9
  tailwindcss: ^4.3.3
  ts-to-zod: ^5.1.0
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: ^0.2.9
  vitest: 4.1.10
  vue: ^3.6.0-rc.4
  vue-component-type-helpers: ^3.3.3
  vue-tsc: ^3.3.9
  zod: ^4.3.5
  sharp: ^0.35.3

overrides:
  es-toolkit: 'catalog:'
  vite: 'catalog:'
  vitest: 'catalog:'
  typescript: npm:typescript-native-bridge@6.0.3-bridge.8.tsgo.7.0.2
  '@c4312/blake3-internal': ^3.0.0

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

minimumReleaseAgeExclude:
  - browserslist